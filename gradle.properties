# プロジェクト全体のGradle設定。
# IDE(Android Studioなど)で設定した値は、このファイルより優先される。
# 詳細: http://www.gradle.org/docs/current/userguide/build_environment.html
# Gradleデーモンに渡すJVM引数。
# 主にメモリの調整に使う。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 有効にするとGradleが試験的な並列モードで動く。
# 疎結合なプロジェクトでのみ使うこと。
# 詳細: http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidXを使う。
# どのパッケージがOS同梱で、どれがAPKに含まれるかを区別しやすくする。
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlinのコードスタイル("official"または"obsolete")
kotlin.code.style=official
# 各ライブラリのRクラスに、そのライブラリ自身のリソースだけを含める。
# 依存先のリソースを含めないので、Rクラスが小さくなる。
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false