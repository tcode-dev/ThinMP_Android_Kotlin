plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId 'dev.tcode.thinmp'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'dev.tcode.thinmp'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.constraintlayout:constraintlayout-compose:1.1.2'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.3'
    implementation 'com.google.accompanist:accompanist-permissions:0.37.3'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-fragment:1.4.0'
    implementation 'androidx.datastore:datastore-preferences:1.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation "androidx.room:room-runtime:2.8.5"
    implementation "androidx.room:room-ktx:2.8.5"
    kapt "androidx.room:room-compiler:2.8.5"
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation 'androidx.media3:media3-session:1.11.1'
    kapt 'com.google.dagger:hilt-compiler:2.60.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // 3.6.1はAPI 35以上で入力を注入できない(内部で使うInputManager.getInstanceが削除された)。
    // ComposeのテストルールもクリックとwaitForIdleにEspressoを使うので、3.7.0が必要。
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.12.1'
    androidTestImplementation "androidx.room:room-testing:2.8.5"
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.12.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.12.1'
}
kapt {
    correctErrorTypes true
    arguments {
        arg('room.schemaLocation', "$projectDir/schemas")
    }
}